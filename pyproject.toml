[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmd-retarget"
version = "0.1.2"
description = "MMD motion retargeting, collision correction and validation toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Fairy0019" }]
dependencies = ["numpy>=1.24"]

[project.scripts]
mmd-retarget = "mmd_retarget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
